name: Build JT Cloud (artifact only)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jt-cloud-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build ${{ matrix.platform }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: x64
            runner: windows-latest
          - platform: win
            arch: ia32
            runner: windows-latest
          - platform: win
            arch: arm64
            runner: windows-latest
          - platform: mac
            arch: x64
            runner: macos-15-intel
          - platform: mac
            arch: arm64
            runner: macos-14
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (retry transient registry/network failures)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm install --no-audit --no-fund --fetch-retries=5 --fetch-timeout=120000; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Dependency installation failed on attempt $attempt; retrying in 15 seconds..."
              sleep 15
            fi
          done
          echo "Dependency installation failed after 3 attempts."
          exit 1
      - name: Check source syntax
        run: npm run check
      - name: Package desktop app
        shell: bash
        env:
          JT_PLATFORM: ${{ matrix.platform }}
          JT_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$JT_PLATFORM" in
            win) npx electron-builder --win --${JT_ARCH} --publish never ;;
            mac) npx electron-builder --mac --${JT_ARCH} --publish never ;;
            linux) npx electron-builder --linux --${JT_ARCH} --publish never ;;
            *) echo "Unsupported platform: $JT_PLATFORM"; exit 2 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: jt-cloud-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
